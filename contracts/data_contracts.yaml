# ============================================================
# Shared Data Contracts
# All modules MUST conform to these schemas.
#
# Updated after inspecting the ACN-Data dataset (acndata_sessions.json).
# Source: Caltech ACN-Data API — site "caltech", Jan–Mar 2019.
# ============================================================

# --- Historical Session Record (Batch Path) ---
# Source: ACN-Data JSON → ingestion/ → processing/ → database/
session_record:
  description: >
    A single EV charging session from the ACN-Data historical dataset.
    Produced by the ingestion module (ingestion/transform.py) and
    consumed by the Spark processing module and PostgreSQL loader.
  source_fields:
    # Fields mapped directly from the ACN-Data JSON
    - name: _id
      target: id
      type: string (VARCHAR 24)
      required: true
      description: MongoDB ObjectId string from ACN-Data. Primary key.

    - name: sessionID
      target: session_id
      type: string (VARCHAR 64)
      required: true
      description: >
        ACN-Data session identifier.
        Format: "{stationID}_{date} {time}" with underscores.
        Unique across all records.

    - name: siteID
      target: site_id
      type: string (VARCHAR 10)
      required: true
      description: Site identifier (e.g., "0002" for Caltech).

    - name: clusterID
      target: cluster_id
      type: string (VARCHAR 10)
      required: true
      description: Cluster identifier within the site.

    - name: stationID
      target: station_id
      type: string (VARCHAR 20)
      required: true
      description: >
        Charging station identifier (e.g., "2-39-138-566").
        53 unique stations in the current dataset.

    - name: spaceID
      target: space_id
      type: string (VARCHAR 10)
      required: true
      description: >
        Parking space label (e.g., "CA-512").
        1-to-1 mapping with stationID.

    - name: connectionTime
      target: connection_time
      type: timestamp with time zone
      required: true
      description: >
        When the vehicle was plugged in. Source format: RFC 2822 (GMT).
        Converted to ISO 8601 UTC by the ETL.

    - name: disconnectTime
      target: disconnect_time
      type: timestamp with time zone
      required: true
      description: >
        When the vehicle was unplugged. Source format: RFC 2822 (GMT).
        Converted to ISO 8601 UTC by the ETL.

    - name: doneChargingTime
      target: done_charging_time
      type: timestamp with time zone
      required: false
      description: >
        Timestamp of the last non-zero charging rate.
        Null in ~0.2% of records (vehicle disconnected before
        charging completed). May be after disconnectTime in ~2.4%
        of records (flagged as anomaly).

    - name: kWhDelivered
      target: kwh_delivered
      type: float (DOUBLE PRECISION)
      required: true
      description: >
        Total energy delivered during the session, in kWh.
        Range: 0.502–75.528 in current dataset.

    - name: userID
      target: user_id
      type: string (VARCHAR 12)
      required: false
      description: >
        Zero-padded user identifier (e.g., "000000558").
        Null in ~12.3% of records (anonymous sessions).

    - name: timezone
      target: timezone
      type: string (VARCHAR 30)
      required: true
      description: >
        IANA timezone of the site (e.g., "America/Los_Angeles").
        All records use the same timezone in current dataset.

  computed_fields:
    # Fields computed by the ETL (not in source JSON)
    - name: session_duration_min
      type: float (DOUBLE PRECISION)
      required: false
      description: >
        (disconnect_time - connection_time) in minutes.
        Null when connection_time > disconnect_time (flagged).

    - name: charging_duration_min
      type: float (DOUBLE PRECISION)
      required: false
      description: >
        (done_charging_time - connection_time) in minutes.
        Null when done_charging_time is null or when
        done_charging_time > disconnect_time (flagged).

    - name: idle_duration_min
      type: float (DOUBLE PRECISION)
      required: false
      description: >
        (disconnect_time - done_charging_time) in minutes.
        Null when done_charging_time is null or when
        done_charging_time > disconnect_time (flagged with
        done_after_disconnect). Never negative; null prevents
        metric contamination in downstream aggregations.

    - name: validation_flags
      type: string (TEXT)
      required: false
      description: >
        Comma-separated validation flags. Null if record is clean.
        Possible flags:
          - duplicate_record_id: duplicate MongoDB _id detected
          - duplicate_session_id: duplicate business sessionID detected
          - done_after_disconnect: doneChargingTime > disconnectTime
          - done_after_disconnect_outlier: doneChargingTime > disconnectTime by > 60s
          - connection_after_disconnect: connectionTime > disconnectTime
          - missing_required_field:{field}: required field is null or empty string
          - kwh_delivered_negative: kWhDelivered < 0
          - kwh_delivered_not_numeric: kWhDelivered not float/int
          - null_done_charging_time_with_energy: doneChargingTime null but energy > 0
          - malformed_user_inputs: userInputs not a list
          - malformed_user_input_entry: entry in userInputs not a dict
          - user_input_negative:{field}: negative value in userInputs numeric field
          - user_input_not_numeric:{field}: non-numeric value in userInputs numeric field
          - user_input_unparseable_timestamp:{field}: invalid timestamp in userInputs

    - name: ingestion_timestamp
      type: timestamp with time zone
      required: true
      description: UTC timestamp of when the ETL processed this record.

# --- User Input Record (normalised from userInputs nested array) ---
session_user_input:
  description: >
    User-submitted charging preferences from the ACN-Data adaptive
    charging interface. One-to-many relationship with session_record.
    Null/absent for ~12.3% of sessions (anonymous users).
  fields:
    - name: session_id
      type: string (VARCHAR 64)
      required: true
      description: FK → session_record.session_id.

    - name: wh_per_mile
      type: integer
      required: true
      source: userInputs[*].WhPerMile
      description: Vehicle energy consumption in Wh per mile.

    - name: kwh_requested
      type: float (DOUBLE PRECISION)
      required: true
      source: userInputs[*].kWhRequested
      description: Energy requested by the user, in kWh.

    - name: miles_requested
      type: integer
      required: true
      source: userInputs[*].milesRequested
      description: Miles of range requested by the user.

    - name: minutes_available
      type: integer
      required: true
      source: userInputs[*].minutesAvailable
      description: Minutes the user expects to remain connected.

    - name: modified_at
      type: timestamp with time zone
      required: true
      source: userInputs[*].modifiedAt
      description: When the user submitted or modified this input.

    - name: payment_required
      type: boolean
      required: true
      source: userInputs[*].paymentRequired
      description: Whether the session requires payment.

    - name: requested_departure
      type: timestamp with time zone
      required: true
      source: userInputs[*].requestedDeparture
      description: User-requested departure time.

    - name: user_id_numeric
      type: integer
      required: true
      source: userInputs[*].userID
      description: >
        Integer form of the user ID. Corresponds to the top-level
        userID after stripping leading zeros (e.g., 558 ↔ "000000558").

# --- Streaming Event Record (Stream Path) ---
# Source: event_generator → Kafka → processing/ → database/
streaming_event:
  description: >
    A simulated real-time charging telemetry event produced by the event
    generator and published to Kafka topic 'charging-events'. Consumed
    by Spark Structured Streaming and persisted to PostgreSQL.
  entity_relationships:
    station_id: Hardware charging port/EVSE. 1 station has <= 1 active session.
    session_id: Unique charging session from plug-in to plug-out. Correlates all events for a session.
    event_id: Unique UUID per telemetry packet. Multiple events share the same session_id and station_id.
    event_type: State machine transition (session_start -> energy_update -> session_end).
  deduplication_policy: >
    Kafka provides at-least-once delivery; duplicate events may occur due to producer
    retries or consumer rebalancing. Downstream Spark Structured Streaming MUST
    deduplicate on 'event_id' using a watermarked stream:
    events_df.withWatermark("timestamp", "10 minutes").dropDuplicates(["event_id"]).
    The database table charging_events enforces PRIMARY KEY (event_id).
  fields:
    - name: event_id
      type: string (VARCHAR 64)
      required: true
      description: >
        Unique event identifier formatted as UUID4 string (e.g., 'evt-74b89f2a-8101-49b9-9d95-8b87201c1f51').
        Guarantees zero collision probability across streaming partitions.

    - name: station_id
      type: string (VARCHAR 20)
      required: true
      description: >
        Identifier of the hardware charging station (e.g., '2-39-81-4550').
        Must match one of the 55 verified Caltech station identifiers
        documented in data/processed/validation/station_summary.csv.

    - name: session_id
      type: string (VARCHAR 64)
      required: true
      description: >
        Identifier of the active charging session. Links telemetry events
        (session_start, energy_update, session_end) belonging to the same physical
        charging cycle. Corresponds to historical batch session_id format.

    - name: event_type
      type: string (VARCHAR 20)
      required: true
      enum: [session_start, session_end, energy_update]
      description: >
        Type/lifecycle state of charging telemetry:
          - session_start: Vehicle connected/charging initiated (energy_kwh = 0.0).
          - energy_update: Periodic heartbeat telemetry during charging.
          - session_end: Vehicle unplugged/charging finished (final energy_kwh).

    - name: timestamp
      type: timestamp with time zone
      format: ISO 8601 (UTC)
      required: true
      description: >
        Event emission timestamp in UTC formatted as ISO 8601 string
        (e.g., '2026-10-19T18:00:00+00:00' or '2026-10-19T18:00:00Z').

    - name: energy_kwh
      type: float (DOUBLE PRECISION)
      required: true
      description: >
        Cumulative metered energy delivered since the start of the current
        session (kWh). Semantics: strictly non-negative (>= 0.0) and
        monotonically non-decreasing across consecutive events of a session.
        Exactly 0.0 at session_start. Final total at session_end.

    - name: incremental_kwh
      type: float (DOUBLE PRECISION)
      required: false
      description: >
        Incremental energy delivered during the immediate reporting interval
        (delta between current event and previous event). Non-negative (>= 0.0).
        0.0 at session_start. The sum of incremental_kwh equals cumulative energy_kwh.

# --- Database Table Mappings ---
database_tables:
  charging_sessions:
    source: session_record
    description: Stores batch-loaded historical sessions.
    primary_key: id
    unique_constraints: [session_id]

  session_user_inputs:
    source: session_user_input
    description: Normalised user input entries linked to sessions.
    primary_key: id (SERIAL)
    foreign_keys:
      session_id: charging_sessions.session_id

  charging_events:
    source: streaming_event
    description: Stores stream-loaded real-time events.
    primary_key: event_id
